<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=Vazirmatn:wght@300;400;500;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f2;--bg2:#f4ede6;--card:#fffdfb;--ink:#1e2230;--mute:#6d6862;--acc:#c58c82;--btn:#1f2431;--btnink:#fff;--line:rgba(30,34,48,.12);--hd:"Cormorant Garamond",Georgia,serif;--bd:"Jost",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0b0d12;--bg2:#0f1218;--card:#151923;--ink:#f3ece4;--mute:#a9a39b;--acc:#f2cfc0;--btn:#f2cfc0;--btnink:#2a1d18;--line:rgba(255,255,255,.09)}
[lang=fa]{--hd:"Vazirmatn",Tahoma,sans-serif;--bd:"Vazirmatn",Tahoma,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.8 var(--bd);transition:background .3s,color .3s}
a{color:inherit}
.w{max-width:1120px;margin:auto;padding:0 24px}
section{padding:68px 0;border-top:1px solid var(--line)}
h2{font:500 clamp(26px,4vw,34px)/1.2 var(--hd);display:flex;align-items:center;gap:18px;margin:0 0 30px}
h2::after{content:"";width:64px;height:1px;background:var(--acc)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 85%,transparent)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:74px}
.logo{display:flex;align-items:center;gap:12px;font:500 20px var(--hd);text-decoration:none}
.mono{min-width:38px;height:38px;padding:0 8px;border:1px solid var(--acc);border-radius:11px;display:grid;place-items:center;font-size:20px}
.links{display:flex;gap:30px}.links a{color:var(--mute);text-decoration:none;font-size:13px}.links a:hover{color:var(--ink)}
.ic{display:flex;gap:14px;align-items:center}
.ic a,.ic button{color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.ic svg{width:21px;height:21px}
svg{flex:none}
.btn{display:inline-flex;gap:8px;align-items:center;padding:12px 26px;border-radius:999px;background:var(--btn);color:var(--btnink);text-decoration:none;font-size:14px;border:1px solid var(--btn);transition:transform .2s}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}.btn:hover{transform:translateY(-2px)}
.ic .btn{display:inline-flex;white-space:nowrap;color:var(--ink)}
.btn.sm{padding:6px 16px;font-size:12px}.btn svg{width:15px;height:15px}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero{border:0;padding:52px 0 76px}
.hi{color:var(--mute);margin:0;font-size:18px}
h1{font:500 clamp(40px,6.4vw,66px)/1.15 var(--hd);margin:6px 0 14px}
.role{display:flex;gap:10px;align-items:center;font-size:20px;margin:0 0 16px}.role svg{width:18px;height:18px;color:var(--acc)}
.lead{color:var(--mute);max-width:46ch;margin:0 0 26px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.pic,.cpic{position:relative}
.blob{aspect-ratio:1/1.05;border-radius:58% 42% 52% 48%/46% 54% 46% 54%;overflow:hidden;border:1px solid var(--line)}
.blob img,.blob .ph,.im img,.im .ph,.ab .fr img,.ab .fr .ph,.arch img,.arch .ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;text-align:center;padding:12px;background:linear-gradient(135deg,var(--card),var(--bg2));color:var(--mute);font-size:13px;border:1px dashed var(--line)}
.cat{position:absolute;inset-inline-end:2%;bottom:0;width:62px;color:var(--ink)}
.note{position:absolute;font:500 19px/1.15 Caveat,var(--bd);color:var(--acc);transform:rotate(-7deg);white-space:pre-line}
.n1{inset-inline-start:-70px;top:12%}.n2{inset-inline-end:-6px;bottom:-26px}.n3{inset-inline-end:-40px;top:0}.n4{inset-inline-end:-6px;bottom:8%}
.ab{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.fr{position:relative;aspect-ratio:1/.9;border-radius:32px;overflow:hidden;border:1px solid var(--line)}
.ab ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;font-size:14px}
.ab li{display:flex;gap:12px;align-items:center;color:var(--mute)}.ab li svg{width:18px;height:18px;color:var(--acc)}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sh{display:flex;align-items:center;gap:12px;font-size:14px}
.sh b{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:500}
.bar{height:5px;border-radius:9px;background:var(--line);margin:12px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.sk small{display:block;text-align:end;color:var(--mute);font-size:11px}
.tr{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 14px}
.tr::-webkit-scrollbar{display:none}
.pc{flex:0 0 calc((100% - 36px)/3);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:16/10}
.pb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.pb h3{margin:0;font:500 17px var(--bd)}.pb p{margin:0;color:var(--mute);font-size:13px;line-height:1.7}
.tg{display:flex;gap:6px;flex-wrap:wrap}.tg span{font-size:11px;padding:2px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.pl{display:flex;justify-content:space-between;margin-top:auto;padding-top:8px;font-size:12px}
.pl a{display:flex;gap:6px;align-items:center;text-decoration:none}.pl svg{width:13px;height:13px}
.ct{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
#ds{display:flex;gap:8px}#ds i{width:8px;height:8px;border-radius:9px;background:var(--line);cursor:pointer;transition:.25s}#ds i.on{width:24px;background:var(--acc)}
.ar{display:flex;gap:10px}
.ar button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ar button:disabled{opacity:.35;cursor:default}.ar svg{width:18px;height:18px}
[dir=rtl] .ar svg{transform:scaleX(-1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.cl{display:flex;gap:22px;flex-wrap:wrap;font-size:13px}.cl a{display:flex;gap:9px;align-items:center;text-decoration:none;color:var(--mute)}.cl svg{width:18px;height:18px;color:var(--ink)}
.arch{aspect-ratio:16/10;border-radius:200px 200px 18px 18px;overflow:hidden;border:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:22px 0}
.fw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--mute)}
.fw .logo{font-size:14px;color:var(--ink)}.fw .mono{min-width:32px;height:32px;font-size:16px}
.up{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}.up svg{width:16px;height:16px}
@media(max-width:900px){.hg,.g2,.ab{grid-template-columns:1fr;gap:34px}.links,.note{display:none}.sg{grid-template-columns:repeat(3,1fr)}.pc{flex-basis:calc((100% - 18px)/2)}.pic{max-width:420px}}
@media(max-width:600px){.sg{grid-template-columns:repeat(2,1fr)}.pc{flex-basis:100%}.fw p{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
